user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Enable gzip compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # IP rate limiting zone
    limit_req_zone $binary_remote_addr zone=hyperdex_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=hyperdex_conn:10m;

    # Load balancing for HyperDex Relayer instances
    upstream hyperdex_relayers {
        # Use IP hash for session persistence
        ip_hash;

        # List of relayer servers
        server relayer1:3000 max_fails=3 fail_timeout=30s weight=1;
        server relayer2:3000 max_fails=3 fail_timeout=30s weight=1;
        server relayer3:3000 max_fails=3 fail_timeout=30s weight=1;

        # Uncomment for keepalive connections
        # keepalive 16;
    }

    # Main server configuration
    server {
        listen 80;
        listen [::]:80;
        server_name api.hyperdex.io;

        # Redirect HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server configuration
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.hyperdex.io;

        # SSL configuration
        ssl_certificate /etc/ssl/certs/hyperdex.crt;
        ssl_certificate_key /etc/ssl/private/hyperdex.key;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;
        
        # Modern SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        
        # HSTS (Strict Transport Security)
        add_header Strict-Transport-Security "max-age=63072000" always;
        
        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # Security headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self'; style-src 'self';";

        # Rate limiting
        limit_req zone=hyperdex_limit burst=20 nodelay;
        limit_conn hyperdex_conn 10;

        # Proxy settings
        location / {
            proxy_pass http://hyperdex_relayers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Caching and buffering
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 8k;
        }

        # Health check endpoint
        location = /health {
            # Only allow internal health checks
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            deny all;
            
            proxy_pass http://hyperdex_relayers/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            
            # Reduced timeouts for health checks
            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
        }

        # Metrics endpoint (protected)
        location = /metrics {
            # Only allow prometheus server
            allow 10.0.0.0/8;
            deny all;
            
            proxy_pass http://hyperdex_relayers/metrics;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Admin endpoints with tighter security
        location ~ ^/admin/.* {
            # Apply stricter rate limiting for admin endpoints
            limit_req zone=hyperdex_limit burst=5 nodelay;
            
            # Only allow from internal admin network
            allow 10.0.0.0/8;
            deny all;
            
            proxy_pass http://hyperdex_relayers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
